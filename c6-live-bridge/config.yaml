name: C6 Live Bridge
version: 0.1.0
slug: c6-live-bridge
url: https://github.com/thetimetraveler/c6-live-bridge
description: Ingress dashboard for C6 bridge health, endpoints, events, configuration, and firmware
arch:
  - aarch64
  - amd64
