name: CCX Bridge
version: 0.5.3
slug: c6-live-bridge
url: https://github.com/thetimetraveler/c6-live-bridge
description: Ingress dashboard for C6 bridge health, endpoints, events, configuration, and firmware
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
homeassistant_api: true
ingress_port: 8099
panel_icon: mdi:access-point-network
map:
  - share:rw
options:
  gateway_host: http://lutron-bridge.local:8080
  gateway_token: ""
  lutron_integrations:
    - lutron_caseta
    - lutron
schema:
  gateway_host: url
  gateway_token: password
  lutron_integrations:
    - match(^[a-z0-9_]{1,64}$)
