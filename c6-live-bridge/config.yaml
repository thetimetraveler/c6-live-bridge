name: CCX Bridge
version: 0.26.0
slug: c6-live-bridge
url: https://github.com/thetimetraveler/c6-live-bridge
description: Ingress dashboard for CCX and CCA bridge health, lighting, events, configuration, and device firmware
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
homeassistant_api: true
services:
  - mqtt:want
ingress_port: 8099
panel_icon: mdi:access-point-network
map:
  - share:rw
options:
  gateway_host: http://lutron-bridge.local:8080
  gateway_token: ""
  lutron_integrations:
    - lutron_caseta
    - lutron
  show_sensors: true
  occupancy_bridges: []
  n4_fallback: auto
  n4_host: ""
  n4_password: ""
  n4_verify_tls: true
  n4_seed_zones: []
schema:
  gateway_host: url
  gateway_token: password
  lutron_integrations:
    - match(^[a-z0-9_]{1,64}$)
  show_sensors: bool
  occupancy_bridges:
    - name: str
      entity_id: match(^binary_sensor\.[a-z0-9_]{1,200}$)
      serial: match(^[0-9A-Fa-f]{8}$)
      on_unavailable: list(hold|vacant)?
      mqtt_topic: str?
  n4_fallback: list(auto|off|force)
  n4_host: str?
  n4_password: password?
  n4_verify_tls: bool
  n4_seed_zones:
    - zone_id: int(1,65535)
      name: str
      n4_group: str
      warm_dim_curve: int(0,254)
      serial: int?
