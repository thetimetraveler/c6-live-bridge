configuration:
  gateway_host:
    name: Gateway URL
    description: HTTP(S) origin of the C6 gateway management API, without a path (for example http://lutron-bridge.local:8080).
  gateway_token:
    name: Gateway token
    description: Management bearer token for the gateway. It stays inside the add-on.
  lutron_integrations:
    name: Lutron integrations
    description: Home Assistant integrations whose lights are used to label zones, show areas and live state. Zones are matched by serial number, then by name.
  show_sensors:
    name: Show sensors
    description: Publish each bridged zone's active Natural Show, show target, requested color temperature and brightness, and confirmed brightness, plus the gateway's lighting output and Zigbee member link, to Home Assistant through MQTT discovery. Needs an MQTT broker app such as Mosquitto.
